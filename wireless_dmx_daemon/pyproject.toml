[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "wireless-dmx-daemon"
version = "0.1.0"
description = "Linux host bridge for DMX Now"
requires-python = ">=3.11"
dependencies = ["pyserial>=3.5"]

[project.scripts]
wireless-dmx = "wireless_dmx.cli:main"
wireless-dmx-dashboard = "wireless_dmx.dashboard:main"

[tool.setuptools.packages.find]
where = ["."]