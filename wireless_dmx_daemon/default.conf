# Safe default: local virtual serial plus Art-Net Universe 0, both accepted.
# The daemon uses latest-state arbitration and a validated 20 Hz pacer.
[virtual_port]
enabled = true
requested_path = "/tmp/wireless-dmx"

[transmitter]
device = "/dev/ttyUSB0"
baud = 115200
data_bits = 8
parity = "none"
stop_bits = 2

[pacer]
enabled = true
rate_hz = 20.0
maximum_rate_hz = 20.0
allow_experimental_rates = false

[artnet]
enabled = true
bind_host = "0.0.0.0"
port = 6454
universe = 0

[input]
source_policy = "latest"

[priority]
enabled = true
max_queue_depth = 4
default_repeat_count = 3
max_repeat_count = 10
default_ttl_seconds = 2.0
lead_in_ms = 500
lead_out_ms = 500
confirmation_window_ms = 1500
max_attempts = 5
max_consecutive_events = 3

[telemetry]
enabled = true
interval_seconds = 10.0
response_timeout_seconds = 2.0
stale_seconds = 15.0
offline_seconds = 30.0
max_report_age_seconds = 5.0