[virtual_port]
requested_path = "/tmp/wireless-dmx"
backend = "linux-pty"

[transmitter]
device = "/dev/ttyUSB0"
baud = 115200
data_bits = 8
parity = "none"
stop_bits = 2

[pacer]
enabled = true
rate_hz = 20.0
maximum_rate_hz = 20.0
allow_experimental_rates = false

[telemetry]
enabled = true
interval_seconds = 10.0
response_timeout_seconds = 2.0
stale_seconds = 15.0
offline_seconds = 30.0
max_report_age_seconds = 5.0